# Publicação no Netlify: site estático, sem etapa de build.
[build]
  publish = "dist"
  command = ""

# Sitemap e robots com o tipo correto
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
